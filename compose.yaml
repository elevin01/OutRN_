name: outrn

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: outrn
      POSTGRES_USER: outrn
      POSTGRES_PASSWORD: outrn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outrn -d outrn"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://outrn:outrn@db:5432/outrn
      OUTRN_USER_AGENT: "${OUTRN_USER_AGENT:-outrn-container (contact: local@example.invalid)}"
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
    entrypoint: ["node", "packages/api/dist/bin/server.js"]
    environment:
      DATABASE_URL: postgres://outrn:outrn@db:5432/outrn
      HOST: 0.0.0.0
      PORT: "4000"
      # Set to require a bearer token on /ops/v1/*. Unset: ops routes are disabled (401). They are
      # open without a token only under NODE_ENV=development (`pnpm dev`), never in this container.
      OUTRN_OPS_TOKEN: ${OUTRN_OPS_TOKEN:-}
      OUTRN_WEB_ORIGINS: http://localhost:3000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
    entrypoint: ["pnpm"]
    command: ["--filter", "@outrn/web", "start", "--hostname", "0.0.0.0"]
    environment:
      # The UI talks to the backend only over HTTP.
      OUTRN_API_URL: http://api:4000
      # The password operators sign in with on /ops (HTTP Basic, any username). Checked here, never
      # attached for a visitor; unset means this web app serves no ops pages.
      OUTRN_OPS_TOKEN: ${OUTRN_OPS_TOKEN:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # The mock API over the contract fixtures: `docker compose --profile mock up web-mock` runs the UI with no database.
  api-mock:
    build:
      context: .
    entrypoint: ["node", "packages/api/dist/bin/mock.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    profiles: ["mock"]

  web-mock:
    build:
      context: .
    entrypoint: ["pnpm"]
    command: ["--filter", "@outrn/web", "start", "--hostname", "0.0.0.0"]
    environment:
      OUTRN_API_URL: http://api-mock:4000
    ports:
      - "3000:3000"
    depends_on:
      api-mock:
        condition: service_healthy
    profiles: ["mock"]

  test:
    build:
      context: .
    entrypoint: ["pnpm"]
    command: ["test"]
    environment:
      DATABASE_URL: postgres://outrn:outrn@db:5432/outrn
      OUTRN_USER_AGENT: "outrn-test (contact: local@example.invalid)"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

  e2e:
    build:
      context: .
    entrypoint: ["bash", "scripts/e2e.sh"]
    environment:
      DATABASE_URL: postgres://outrn:outrn@db:5432/outrn
      OUTRN_USER_AGENT: "outrn-e2e (contact: local@example.invalid)"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

volumes:
  postgres-data:
