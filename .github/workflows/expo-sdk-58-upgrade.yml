name: Expo SDK 58 upgrade lockfile
on:
  workflow_dispatch:
  push:
    branches: [chore/expo-sdk-58]
permissions:
  contents: write
jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, 'chore(mobile): resolve SDK 58 dependencies')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/expo-sdk-58
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Align SDK-compatible native package versions
        working-directory: apps/mobile
        run: pnpm exec expo install --fix --pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Commit resolved mobile dependencies and workspace lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(mobile): resolve SDK 58 dependencies"
            git push origin HEAD:chore/expo-sdk-58
          fi
      - run: pnpm exec expo-doctor apps/mobile
      - run: pnpm mobile:typecheck
      - run: pnpm --filter @outrn/mobile lint
      - name: Export native and web bundles
        run: pnpm mobile:export
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          EXPO_PUBLIC_DEMO_MODE: 'false'
